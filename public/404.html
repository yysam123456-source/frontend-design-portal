<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 — Page Not Found | Frontend Design Gallery</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --accent: #ff4d00;
        --bg: #ffffff;
        --bg-secondary: #f5f5f5;
        --ink: #0a0a0a;
        --ink-muted: #666666;
        --ink-subtle: #999999;
        --border: #e5e5e5;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      main { max-width: 520px; text-align: center; }
      .code {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: var(--accent);
        line-height: 1;
      }
      h1 { margin-top: 16px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
      p { margin-top: 12px; font-size: 14px; line-height: 1.7; color: var(--ink-muted); }
      .actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid var(--border);
        color: var(--ink);
        background: var(--bg-secondary);
      }
      a.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
      .hint { margin-top: 24px; font-size: 12px; color: var(--ink-subtle); }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>This page does not exist</h1>
      <p>
        The URL you requested was not found in the Frontend Design Gallery. It may have been moved,
        renamed, or never existed.
      </p>
      <div class="actions">
        <a class="primary" href="/">Browse the gallery</a>
        <a href="/projects/react-bits">React Bits</a>
        <a href="/categories/buttons">Buttons</a>
      </div>
      <p class="hint">Looking for a specific component? Use the search in the Components gallery.</p>
    </main>
  </body>
</html>
