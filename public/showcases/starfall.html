<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星落镇 Starfall — 旅人手记</title>
<style>
  :root{
    --paper: rgba(247,242,232,.88);
    --ink: #3b3128;
    --ink-soft: #6f6558;
    --line: rgba(59,49,40,.16);
    --gold: #c08b3e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#dfeaf0;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); }
  #app{ position:fixed; inset:0;
    background:linear-gradient(#8cc6e8 0%,#d6eaf2 78%,#e6eef2 100%); }
  #skycloud{ position:absolute; inset:-4%; pointer-events:none; z-index:0;
    background-size:cover; background-position:50% 30%;
    opacity:.88; transition:opacity .8s;
    animation: cloudDrift 200s ease-in-out infinite alternate; }
  @keyframes cloudDrift{
    from{ transform:translate3d(-1.6%,0,0) scale(1.02); }
    to{ transform:translate3d(1.6%,0,0) scale(1.07); }
  }
  #sunglow{ position:absolute; width:62vmax; height:62vmax; z-index:0;
    margin:-31vmax 0 0 -31vmax; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle,
      rgba(255,251,232,.85) 0%, rgba(255,247,218,.42) 20%,
      rgba(255,244,208,.14) 44%, rgba(255,242,202,0) 72%); }
  canvas{ display:block; position:relative; z-index:1; }
  /* 岛体后方柔光：让浮岛不像是硬贴上去的 */
  #halo{ position:absolute; left:50%; top:56%; width:82vmax; height:54vmax;
    transform:translate(-50%,-50%); border-radius:50%; z-index:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(255,253,246,.55) 0%, rgba(255,250,238,.26) 42%,
      rgba(255,248,232,0) 70%); }
  /* 统一色调：轻微暖角晕，压掉 CG 的塑料感 */
  #grade{ position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(124% 96% at 50% 44%,
      rgba(255,247,232,0) 48%, rgba(255,230,199,.16) 100%); }

  /* ── 左上：旅人手记刊头 ── */
  .journal{ position:fixed; top:30px; left:36px; z-index:10; pointer-events:none;
    user-select:none; }
  .journal .kicker{ font-size:10px; letter-spacing:3.2px; font-weight:700;
    color:#5f707b; text-transform:uppercase; }
  .journal h1{ margin:1px 0 0; font-family:Georgia,"Songti SC","Noto Serif SC",serif;
    font-style:italic; font-weight:500; font-size:54px; line-height:1;
    letter-spacing:-1.5px; color:#4a4038;
    text-shadow:0 2px 20px rgba(255,255,255,.55); }
  .journal .sub{ margin-top:8px; font-size:11px; letter-spacing:5px;
    color:#4a4038; opacity:.72; }

  /* 夜间：手记文字转为浅色，避免糊在暗天上 */
  body.is-night .journal h1{ color:#f6f1e4;
    text-shadow:0 2px 26px rgba(10,14,30,.72); }
  body.is-night .journal .kicker{ color:#c8d4ea; }
  body.is-night .journal .sub{ color:#dfe6f3; opacity:.8; }
  body.is-night .hint{ color:#dfe6f3; opacity:.6; }

  /* ── 右上：时间面板 ── */
  .timepanel{ position:fixed; top:28px; right:32px; width:268px; z-index:10;
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px 12px; backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(60,74,86,.14); }
  .trow{ display:flex; align-items:center; justify-content:space-between;
    font-size:13px; font-weight:700; letter-spacing:.5px; }
  .trow .lefthalf{ display:flex; align-items:center; gap:9px; }
  .playbtn{ appearance:none; width:26px; height:26px; flex:none; padding:0;
    border:1px solid var(--line); border-radius:8px; cursor:pointer;
    background:rgba(255,255,255,.55); color:var(--ink-soft);
    font:600 9px/1 inherit; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
    transition:all .18s; }
  .playbtn:hover{ background:#3b3128; color:#f6f1e7; border-color:#3b3128; }
  .trow .phase{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); }
  .trow .phase .ico{ font-size:14px; }
  #clock{ font-family:Georgia,serif; font-size:17px; letter-spacing:1px; color:var(--gold); }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%;
    height:18px; background:transparent; margin:9px 0 4px; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{
    height:3px; border-radius:3px; background:rgba(59,49,40,.16); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; margin-top:-5px;
    border-radius:50%; background:var(--gold); border:2px solid #fdfaf3;
    box-shadow:0 2px 6px rgba(120,80,20,.35); }
  input[type=range]::-moz-range-track{ height:3px; border-radius:3px;
    background:rgba(59,49,40,.16); }
  input[type=range]::-moz-range-thumb{ width:11px; height:11px; border-radius:50%;
    background:var(--gold); border:2px solid #fdfaf3; }

  .seasons{ display:flex; gap:0; margin-top:6px; border-radius:9px;
    overflow:hidden; border:1px solid var(--line); }
  .seasons button{ flex:1; appearance:none; border:0; background:transparent;
    font:600 12px/1 inherit; font-family:inherit; letter-spacing:2px;
    padding:7px 0; cursor:pointer; color:var(--ink-soft); transition:all .2s; }
  .seasons button + button{ border-left:1px solid var(--line); }
  .seasons button:hover{ background:rgba(59,49,40,.05); }
  .seasons button.on{ background:#3b3128; color:#f6f1e7; }

  /* ── 底部：场景模式 ── */
  .modes{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    z-index:10; display:flex; gap:5px; padding:6px; border-radius:14px;
    background:var(--paper); border:1px solid var(--line);
    backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(60,74,86,.14);
    white-space:nowrap; }
  .modes button{ appearance:none; border:0; background:transparent;
    font:600 12px/1 inherit; font-family:inherit; letter-spacing:1px;
    padding:9px 14px; border-radius:9px; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; transition:all .2s; }
  .modes button .n{ font-size:9px; opacity:.5; font-family:Georgia,serif; }
  .modes button:hover{ background:rgba(59,49,40,.06); }
  .modes button.on{ background:#3b3128; color:#f6f1e7; }
  .modes button.on .n{ opacity:.7; }

  .hint{ position:fixed; right:34px; bottom:34px; z-index:9; font-size:10.5px;
    letter-spacing:1.6px; color:#4a4038; opacity:.55; }
  .hint b{ font-weight:700; }

  /* 载入提示：3D 资源到位前先盖一层 */
  #boot{ position:fixed; inset:0; z-index:40; display:flex;
    align-items:center; justify-content:center;
    background:linear-gradient(#a6d3e9 0%,#dcebf1 68%,#eaf2f4 100%);
    color:#5d6d77; font-size:11px; letter-spacing:6px;
    transition:opacity .8s ease; }
  #boot.done{ opacity:0; pointer-events:none; }

  .blabel{ position:fixed; z-index:20; pointer-events:none; opacity:0;
    transform:translate(-50%,-140%); padding:6px 12px; border-radius:8px;
    background:rgba(250,246,238,.95); border:1px solid rgba(59,49,40,.18);
    font-size:12px; font-weight:700; letter-spacing:1px; color:#3b3128;
    box-shadow:0 8px 20px rgba(50,60,70,.18); transition:opacity .25s; white-space:nowrap; }
  .blabel.show{ opacity:1; }

  @media (max-width:760px){
    .journal{ top:16px; left:16px; }
    .journal h1{ font-size:34px; }
    .journal .kicker{ font-size:8px; letter-spacing:2px; }
    .journal .sub{ font-size:9px; letter-spacing:3px; }
    .timepanel{ top:auto; bottom:74px; right:12px; left:12px; width:auto; }
    .modes{ bottom:12px; max-width:calc(100vw - 24px); overflow-x:auto; }
    .modes button{ padding:8px 10px; font-size:11px; }
    .hint{ display:none; }
  }
</style>
</head>
<body>

<div id="app"><div id="skycloud"></div><div id="halo"></div><div id="sunglow"></div><div id="grade"></div></div>
<div id="boot"><span>星落镇 · 正在搭镇</span></div>
<div id="label" class="blabel"></div>

<header class="journal">
  <div class="kicker">✦ Wayfarer's Journal / 02</div>
  <h1>Starfall</h1>
  <div class="sub">星落镇 · 旅人手记</div>
</header>

<section class="timepanel">
  <div class="trow">
    <span class="lefthalf">
      <button class="playbtn" id="playBtn" aria-label="播放 / 暂停昼夜循环">❚❚</button>
      <span class="phase"><span class="ico" id="phaseIco">☀</span><span id="phaseName">白昼</span></span>
    </span>
    <span id="clock">10:00</span>
  </div>
  <input id="slider" type="range" min="0" max="1439" value="600">
  <div class="seasons">
    <button data-season="spring">春</button>
    <button data-season="summer" class="on">夏</button>
    <button data-season="autumn">秋</button>
    <button data-season="winter">冬</button>
  </div>
</section>

<nav class="modes">
  <button class="on" data-view="all"><span class="n">01</span>全景</button>
  <button data-view="village"><span class="n">02</span>村落</button>
  <button data-view="bridge"><span class="n">03</span>河桥</button>
  <button data-view="mill"><span class="n">04</span>风车</button>
  <button data-view="market"><span class="n">05</span>灯市</button>
</nav>

<div class="hint">拖拽旋转 · 滚轮缩放 · <b>点击建筑</b>看名字</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

/* ═══════════════════════════════════════════════════════════════
   星落镇 Starfall — 浮岛微缩沙盘
   美术方向：等距固定机位 / 浮空土岛 / 都铎半木构 / 高明度粉彩
   ═══════════════════════════════════════════════════════════════ */

/* ── 1. 状态与四季节气 ── */
const DAY = 1440
const state = {
  minute: 600,
  playing: true,
  speed: 18,
  season: 'summer',
  blend: { spring: 0, summer: 1, autumn: 0, winter: 0 },
}
const SEASON_KEYS = ['spring', 'summer', 'autumn', 'winter']

const SEASONS = {
  spring: { zh: '春', grass: '#accd80', leaf: '#96c96a', leaf2: '#b8dd8c', blossom: '#f8c3d1', soil: '#bb8f63' },
  summer: { zh: '夏', grass: '#9dc06d', leaf: '#7cb648', leaf2: '#9ccf6c', blossom: '#f7bccb', soil: '#b0824f' },
  autumn: { zh: '秋', grass: '#cbb273', leaf: '#d6994f', leaf2: '#c8884a', blossom: '#e9bcbb', soil: '#a1743f' },
  winter: { zh: '冬', grass: '#f2f6f8', leaf: '#b6c7cd', leaf2: '#d4dfe3', blossom: '#eef3f5', soil: '#8f7a63' },
}

/* ── 天空关键帧 [分钟, 屏幕顶部色, 底部雾色] ── */
const SKY_STOPS = [
  [0,    '#0f1730', '#26314f'],
  [270,  '#0f1730', '#26314f'],
  [340,  '#5a5f96', '#a08aa8'],
  [395,  '#e8a98e', '#f7d0a8'],
  [455,  '#a9d3ea', '#e6eef2'],
  [520,  '#8cc6e8', '#d6eaf2'],
  [760,  '#86bee4', '#d5e8f2'],
  [1010, '#aecbe0', '#e8dfc4'],
  [1080, '#eda47a', '#f6cb9f'],
  [1140, '#7c6d98', '#8f7c9e'],
  [1210, '#20294a', '#37405f'],
  [1440, '#0f1730', '#26314f'],
]

const clamp = (x, a, b) => Math.max(a, Math.min(b, x))
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t) }
const lerp = (a, b, t) => a + (b - a) * t

/* 季节混色：所有权重插值，避免突变 */
const _mix = new THREE.Color(), _tmp = new THREE.Color()
function seasonMix(key) {
  _mix.setRGB(0, 0, 0)
  for (const s of SEASON_KEYS) {
    const w = state.blend[s]
    if (w <= 0.001) continue
    _tmp.set(SEASONS[s][key])
    _mix.r += _tmp.r * w
    _mix.g += _tmp.g * w
    _mix.b += _tmp.b * w
  }
  return _mix
}

/* 天空取样 */
const _skyA = new THREE.Color(), _skyB = new THREE.Color()
function skyAt(m) {
  for (let i = 0; i < SKY_STOPS.length - 1; i++) {
    const cur = SKY_STOPS[i], nxt = SKY_STOPS[i + 1]
    if (m >= cur[0] && m <= nxt[0]) {
      const t = (m - cur[0]) / (nxt[0] - cur[0])
      _skyA.set(cur[1]).lerp(_tmp.set(nxt[1]), t)
      _skyB.set(cur[2]).lerp(_tmp.set(nxt[2]), t)
      return { top: _skyA, fog: _skyB }
    }
  }
  _skyA.set(SKY_STOPS[0][1])
  _skyB.set(SKY_STOPS[0][2])
  return { top: _skyA, fog: _skyB }
}

/* 太阳高度：6 点升，12 点顶，18 点落 */
const sunHeightAt = m => Math.sin((m - 360) / DAY * Math.PI * 2)

/* ── DOM ── */
const $ = id => document.getElementById(id)
const elClock = $('clock'), elPhase = $('phaseName'), elPhaseIco = $('phaseIco')
const elSlider = $('slider'), elLabel = $('label'), elPlay = $('playBtn')
const fmtClock = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`

/* ── 2. 渲染器 / 等距正交相机 / 光照 ── */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' })
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setClearAlpha(0)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFShadowMap
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.09
$('app').appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = null
scene.fog = new THREE.Fog('#e6eef2', 240, 430)

const elApp = $('app')

let VIEW = 15.2
const aspect0 = window.innerWidth / window.innerHeight
const camera = new THREE.OrthographicCamera(-VIEW * aspect0, VIEW * aspect0, VIEW, -VIEW, 0.1, 520)
const CAM_DIR = new THREE.Vector3(1, 0.55, 1).normalize()
camera.position.copy(CAM_DIR).multiplyScalar(160)
camera.lookAt(0, -1, 0)

const controls = new OrbitControls(camera, renderer.domElement)
controls.target.set(0, -1.2, 0)
controls.enableDamping = true
controls.dampingFactor = 0.07
controls.minPolarAngle = 1.13
controls.maxPolarAngle = 1.31
controls.minAzimuthAngle = 0.64
controls.maxAzimuthAngle = 0.94
controls.zoomToCursor = true
controls.update()

/* 光照：天光打底，阳光明确，阴影柔和 */
const hemi = new THREE.HemisphereLight(0xdfeef8, 0xa9b184, 0.92)
scene.add(hemi)

const sun = new THREE.DirectionalLight(0xfff4e4, 1.85)
sun.position.set(36, 52, 24)
sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048)
sun.shadow.camera.left = -46
sun.shadow.camera.right = 46
sun.shadow.camera.top = 46
sun.shadow.camera.bottom = -46
sun.shadow.camera.near = 1
sun.shadow.camera.far = 220
sun.shadow.bias = -0.0006
sun.shadow.normalBias = 0.02
sun.shadow.radius = 3
scene.add(sun)

const fill = new THREE.DirectionalLight(0xc8dcec, 0.45)
fill.position.set(-34, 26, -30)
scene.add(fill)

const moon = new THREE.DirectionalLight(0xa6b8e4, 0)
moon.position.set(-28, 40, -30)
scene.add(moon)

/* 云海反射：从下方补暖光，避免岛底发黑 */
const bounce = new THREE.DirectionalLight(0xffe0bc, 0.55)
bounce.position.set(-6, -40, 26)
scene.add(bounce)

/* 星空 */
const starGeo = new THREE.BufferGeometry()
{
  /* 正交相机的可视范围很小，星星必须撒在这个盒子里才会出现在画面上 */
  const N = 420, arr = new Float32Array(N * 3)
  for (let i = 0; i < N; i++) {
    arr[i * 3] = (Math.random() - 0.5) * 92
    arr[i * 3 + 1] = -6 + Math.random() * 44
    arr[i * 3 + 2] = -30 - Math.random() * 26
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3))
}
const starMat = new THREE.PointsMaterial({
  color: 0xdfe9ff, size: 0.34, transparent: true, opacity: 0,
  fog: false, sizeAttenuation: true, depthWrite: false,
})
scene.add(new THREE.Points(starGeo, starMat))

/* 萤火虫：夜间在村子里漂浮的暖光点 */
const FIREFLY_N = 90
const fireflyGeo = new THREE.BufferGeometry()
const fireflyBase = []
const fireflySeed = []
{
  const arr = new Float32Array(FIREFLY_N * 3)
  for (let i = 0; i < FIREFLY_N; i++) {
    const a = Math.random() * Math.PI * 2
    const r = 5 + Math.random() * 15
    const x = Math.cos(a) * r
    const z = Math.sin(a) * r * 0.75
    const y = 0.6 + Math.random() * 2.2
    arr[i * 3] = x
    arr[i * 3 + 1] = y
    arr[i * 3 + 2] = z
    fireflyBase.push(x, y, z)
    fireflySeed.push({ ph: Math.random() * 6.28, sp: 0.35 + Math.random() * 0.7 })
  }
  fireflyGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3))
}
const fireflyMat = new THREE.PointsMaterial({
  color: 0xffe9a8, size: 0.19, transparent: true, opacity: 0,
  fog: false, sizeAttenuation: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
})
scene.add(new THREE.Points(fireflyGeo, fireflyMat))

/* ═══════════════════════════════════════════════════════════════
   3. 浮空岛：不规则轮廓 + 草皮边 + 土层 + 收窄底面
   ═══════════════════════════════════════════════════════════════ */
const ISLAND_RX = 23, ISLAND_RZ = 16.4
const ISLAND_PTS = []
{
  const N = 108
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2
    const k = 1
      + 0.055 * Math.sin(a * 3 + 0.6)
      + 0.038 * Math.sin(a * 5 + 2.2)
      + 0.026 * Math.cos(a * 7 + 1.1)
      + 0.018 * Math.sin(a * 11)
    ISLAND_PTS.push(new THREE.Vector2(Math.cos(a) * ISLAND_RX * k, Math.sin(a) * ISLAND_RZ * k))
  }
}

function islandTopGeometry(pts) {
  const pos = [0, 0, 0], uv = [0.5, 0.5], idx = [], n = pts.length
  for (let i = 0; i < n; i++) {
    const p = pts[i]
    pos.push(p.x, 0, p.y)
    uv.push(p.x / 52 + 0.5, p.y / 44 + 0.5)
  }
  for (let i = 0; i < n; i++) {
    idx.push(0, 1 + ((i + 1) % n), 1 + i)
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2))
  g.setIndex(idx)
  g.computeVertexNormals()
  return g
}

function skirtGeometry(pts, y0, y1, s0, s1) {
  const pos = [], idx = [], n = pts.length
  for (let i = 0; i < n; i++) {
    const p = pts[i]
    pos.push(p.x * s0, y0, p.y * s0)
    pos.push(p.x * s1, y1, p.y * s1)
  }
  for (let i = 0; i < n; i++) {
    const a = i * 2, b = i * 2 + 1
    const c = ((i + 1) % n) * 2, d = ((i + 1) % n) * 2 + 1
    idx.push(a, b, c, b, d, c)
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setIndex(idx)
  g.computeVertexNormals()
  return g
}

/* ── 草地纹理：灰度噪点，颜色由季节乘色控制 ── */
function makeGrassTexture() {
  const S = 1024
  const cv = document.createElement('canvas')
  cv.width = cv.height = S
  const ctx = cv.getContext('2d')
  ctx.fillStyle = '#f2f2f2'
  ctx.fillRect(0, 0, S, S)
  for (let i = 0; i < 14000; i++) {
    const x = Math.random() * S, y = Math.random() * S
    const r = 0.8 + Math.random() * 2.6
    const v = 205 + Math.random() * 50
    ctx.fillStyle = `rgba(${v},${v},${v},${0.25 + Math.random() * 0.5})`
    ctx.beginPath()
    ctx.arc(x, y, r, 0, Math.PI * 2)
    ctx.fill()
  }
  // 大块明暗，避免死板
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * S, y = Math.random() * S

}

/* 沿方向 (px,pz) 求岛缘交点，保证河流真的流到岛边 */
function islandRim(px, pz, shrink = 1) {
  let best = Infinity
  for (let i = 0; i < ISLAND_PTS.length; i++) {
    const a = ISLAND_PTS[i], b = ISLAND_PTS[(i + 1) % ISLAND_PTS.length]
    const ex = b.x - a.x, ez = b.y - a.y
    const den = px * ez - pz * ex
    if (Math.abs(den) < 1e-9) continue
    const t = (a.x * ez - a.y * ex) / den
    const u = (a.x * pz - a.y * px) / den
    if (t > 0 && u >= 0 && u <= 1 && t < best) best = t
  }
  if (!isFinite(best)) return { x: px, z: pz }
  return { x: px * best * shrink, z: pz * best * shrink }
}
function ribbonMesh(curve, width, y, mat, segs = 140) {
  const pos = [], uv = [], idx = []
  const n = new THREE.Vector3()
  for (let i = 0; i <= segs; i++) {
    const t = i / segs
    const p = curve.getPointAt(t)
    const tan = curve.getTangentAt(t)
    n.set(-tan.z, 0, tan.x).normalize().multiplyScalar(width / 2)
    pos.push(p.x - n.x, y, p.z - n.z)
    pos.push(p.x + n.x, y, p.z + n.z)
    uv.push(0, t * 10)
    uv.push(1, t * 10)
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3
    idx.push(a, b, c, b, d, c)
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2))
  g.setIndex(idx)
  g.computeVertexNormals()
  const m = new THREE.Mesh(g, mat)
  m.receiveShadow = true
  return m
}

const stoneMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#b9b2a4'), flatShading: true })
const stoneDark = new THREE.MeshLambertMaterial({ color: new THREE.Color('#9a9385'), flatShading: true })

function buildBridge(cx, cz, rot) {
  const g = new THREE.Group()
  g.position.set(cx, 0, cz)
  g.rotation.y = rot

  const SPAN = 4.7
  const HALF = SPAN / 2
  const DECK_W = 2.0
  const END_Y = 0.13          // 桥头高度
  const RISE = 0.74           // 拱高
  const DECK_T = 0.15         // 桥面石板厚
  const WALL_BOTTOM = -0.18   // 桥台埋入河床
  const ARCH_Y = -0.05        // 拱脚标高
  const ARCH_R = 1.16         // 拱洞半跨
  const ARCH_H = 0.57         // 拱洞矢高

  const deckX = t => (t - 0.5) * SPAN
  const deckY = t => END_Y + Math.sin(t * Math.PI) * RISE

  /* ── 桥身侧墙：外轮廓是拱桥曲线，中间挖出真实拱洞 ── */
  const profile = new THREE.Shape()
  const N = 48
  profile.moveTo(-HALF, WALL_BOTTOM)
  for (let i = 0; i <= N; i++) {
    const t = i / N
    profile.lineTo(deckX(t), deckY(t) - DECK_T / 2)
  }
  profile.lineTo(HALF, WALL_BOTTOM)
  profile.closePath()

  const hole = new THREE.Path()
  hole.moveTo(-ARCH_R, ARCH_Y)
  hole.absellipse(0, ARCH_Y, ARCH_R, ARCH_H, Math.PI, 0, true)
  hole.lineTo(-ARCH_R, ARCH_Y)
  profile.holes.push(hole)

  const wallGeo = new THREE.ExtrudeGeometry(profile, {
    depth: DECK_W, bevelEnabled: false, curveSegments: 28, steps: 1,
  })
  wallGeo.translate(0, 0, -DECK_W / 2)
  const wall = new THREE.Mesh(wallGeo, stoneMat)
  wall.castShadow = true
  wall.receiveShadow = true
  g.add(wall)

  /* ── 拱券：沿洞口边缘的一圈楔石 ── */
  const ringMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#cdc6b6'), flatShading: true })
  for (const s of [-1, 1]) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(ARCH_R, 0.078, 5, 26, Math.PI), ringMat
    )
    ring.position.set(0, ARCH_Y, s * (DECK_W / 2 + 0.004))
    ring.castShadow = true
    g.add(ring)
  }
  /* 拱心石 */
  const keystone = new THREE.Mesh(
    new THREE.BoxGeometry(0.19, 0.19, DECK_W + 0.03), ringMat
  )
  keystone.position.set(0, ARCH_Y + ARCH_H + 0.04, 0)
  keystone.castShadow = true
  g.add(keystone)

  /* ── 桥面：分段石板贴合拱线 ── */
  const SEG = 14
  for (let i = 0; i < SEG; i++) {
    const t0 = i / SEG, t1 = (i + 1) / SEG
    const x0 = deckX(t0), y0 = deckY(t0), x1 = deckX(t1), y1 = deckY(t1)
    const len = Math.hypot(x1 - x0, y1 - y0) + 0.02
    const deck = new THREE.Mesh(new THREE.BoxGeometry(len, DECK_T, DECK_W + 0.06), stoneMat)
    deck.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0)
    deck.rotation.z = Math.atan2(y1 - y0, x1 - x0)
    deck.castShadow = true
    deck.receiveShadow = true
    g.add(deck)
  }

  /* ── 两侧石栏：立柱 + 随拱起伏的栏板 ── */
  const railBase = t => deckY(t) + DECK_T / 2
  for (const s of [-1, 1]) {
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.40, 0.13), stoneDark)
      post.position.set(deckX(t), railBase(t) + 0.20, s * (DECK_W / 2 - 0.06))
      post.castShadow = true
      g.add(post)
    }
    for (let i = 0; i < SEG; i++) {
      const t0 = i / SEG, t1 = (i + 1) / SEG
      const x0 = deckX(t0), y0 = railBase(t0) + 0.38, x1 = deckX(t1), y1 = railBase(t1) + 0.38
      const len = Math.hypot(x1 - x0, y1 - y0) + 0.02
      const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.09, 0.14), stoneDark)
      rail.position.set((x0 + x1) / 2, (y0 + y1) / 2, s * (DECK_W / 2 - 0.06))
      rail.rotation.z = Math.atan2(y1 - y0, x1 - x0)
      rail.castShadow = true
      g.add(rail)
    }
  }

  scene.add(g)
  return g
}

function makeSkyCloudTexture() {
  const W = 1600, H = 900
  const cv = document.createElement('canvas')
  cv.width = W; cv.height = H
  const ctx = cv.getContext('2d')
  ctx.clearRect(0, 0, W, H)

      g.addColorStop(0.52, `rgba(255,255,255,${alpha * 0.60})`)
      g.addColorStop(1, 'rgba(255,255,255,0)')
      ctx.save()
      ctx.translate(px, py)
      ctx.scale(1, 0.52)
      ctx.fillStyle = g
      ctx.beginPath()
      ctx.arc(0, 0, r, 0, Math.PI * 2)
      ctx.fill()
      ctx.restore()
    }

      90 + Math.random() * 150,

    )
  }
  return cv.toDataURL('image/png')
}

/* 屋瓦：横向瓦沟 + 竖向错缝，叠在屋顶色上 */
function makeRoofTexture() {
  const S = 256
  const cv = document.createElement('canvas')
  cv.width = cv.height = S
  const ctx = cv.getContext('2d')
  ctx.fillStyle = '#ffffff'
  ctx.fillRect(0, 0, S, S)
  const ROWS = 8, COLS = 7
  const rowH = S / ROWS, colW = S / COLS
  for (let r = 0; r < ROWS; r++) {
    const y = r * rowH
    const g = ctx.createLinearGradient(0, y, 0, y + rowH)
    g.addColorStop(0, 'rgba(0,0,0,.20)')
    g.addColorStop(0.22, 'rgba(255,255,255,.14)')
    g.addColorStop(0.80, 'rgba(0,0,0,.05)')
    g.addColorStop(1, 'rgba(0,0,0,.16)')
    ctx.fillStyle = g
    ctx.fillRect(0, y, S, rowH)
    const off = (r % 2) * (colW / 2)
    ctx.strokeStyle = 'rgba(0,0,0,.12)'
    ctx.lineWidth = 1.6
    for (let c = -1; c <= COLS; c++) {
      const x = off + c * colW
      ctx.beginPath()
      ctx.moveTo(x, y)
      ctx.lineTo(x, y + rowH)
      ctx.stroke()
    }
  }
  const t = new THREE.CanvasTexture(cv)
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.repeat.set(2.2, 1.6)
  t.colorSpace = THREE.SRGBColorSpace
  return t
}
const roofTex = makeRoofTexture()

/* 接触阴影：柔和的径向暗斑，让物体看起来真的落在地上 */
function makeBlobTexture() {
  const S = 128
  const cv = document.createElement('canvas')
  cv.width = cv.height = S
  const ctx = cv.getContext('2d')
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2)
  g.addColorStop(0, 'rgba(46,42,32,.46)')
  g.addColorStop(0.42, 'rgba(46,42,32,.22)')
  g.addColorStop(1, 'rgba(46,42,32,0)')
  ctx.fillStyle = g
  ctx.fillRect(0, 0, S, S)
  const t = new THREE.CanvasTexture(cv)
  t.colorSpace = THREE.SRGBColorSpace
  return t
}
const blobTex = makeBlobTexture()
const blobGeo = new THREE.PlaneGeometry(1, 1)

function addGroundBlob(parent, rx, rz, y = 0.012) {
  const mat = new THREE.MeshBasicMaterial({
    map: blobTex, transparent: true, depthWrite: false, opacity: 0.85,
  })
  const m = new THREE.Mesh(blobGeo, mat)
  m.rotation.x = -Math.PI / 2
  m.scale.set(rx, rz, 1)
  m.position.y = y
  m.renderOrder = 1
  parent.add(m)
  return m
}

/* 窗户共享材质：浅抹灰窗套 + 深色玻璃，夜里统一点亮 */
const winGlassMat = new THREE.MeshLambertMaterial({

windowMats.push(winGlassMat)
const winFrameMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#f6eedf') })
const winTrimMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#e6dac3') })

function addBox(parent, sx, sy, sz, x, y, z, mat, rz) {
  const m = new THREE.Mesh(boxGeo, mat)
  m.scale.set(sx, sy, sz)
  m.position.set(x, y, z)

  parent.add(m)
  return m
}

/* 木构架：四立面的柱 / 梁 / 斜撑 */
function timberFrame(g, w, d, y0, h) {
  const t = 0.085
  const faces = [
    { ax: 'z', sign: 1, span: w, off: d / 2 },
    { ax: 'z', sign: -1, span: w, off: d / 2 },
    { ax: 'x', sign: 1, span: d, off: w / 2 },
    { ax: 'x', sign: -1, span: d, off: w / 2 },
  ]
  for (const f of faces) {
    const mid = y0 + h / 2
    const top = y0 + h - t / 2
    const bot = y0 + t / 2
    // 上下横梁
    if (f.ax === 'z') {
      addBox(g, f.span, t, t, 0, top, f.sign * (f.off + 0.012), timberMat)
      addBox(g, f.span, t, t, 0, bot, f.sign * (f.off + 0.012), timberMat)
    } else {
      addBox(g, t, t, f.span, f.sign * (f.off + 0.012), top, 0, timberMat)
      addBox(g, t, t, f.span, f.sign * (f.off + 0.012), bot, 0, timberMat)
    }
    // 三根竖柱
    for (const k of [-1, 0, 1]) {
      const p = k * (f.span / 2 - t * 0.7)
      if (f.ax === 'z') {
        addBox(g, t, h, t, p, mid, f.sign * (f.off + 0.012), timberMat)
      } else {
        addBox(g, t, h, t, f.sign * (f.off + 0.012), mid, p, timberMat)
      }
    }
    // 两侧斜撑（山墙面才有，短面省略）
    if (f.span > 1.9) {
      const bl = Math.hypot(f.span * 0.34, h * 0.42)
      const ang = Math.atan2(h * 0.42, f.span * 0.34)
      for (const s of [-1, 1]) {
        const px = s * (f.span * 0.25)
        const py = y0 + h * 0.42
        if (f.ax === 'z') {
          const b = addBox(g, bl, t * 0.9, t * 0.9, px, py, f.sign * (f.off + 0.012), timberMat, s * ang)
          b.castShadow = true
        } else {
          const b = addBox(g, t * 0.9, t * 0.9, bl, f.sign * (f.off + 0.012), py, px, timberMat)
          b.rotation.x = -s * ang
          b.castShadow = true
        }
      }
    }
  }
}

/* 窗：浅抹灰窗套 + 深色玻璃 + 十字窗棂 + 窗台 */
function addWindow(g, x, y, z, ry, ww, hh) {
  const nx = Math.sin(ry), nz = Math.cos(ry)

  // 窗套（比玻璃大一圈，凸出墙面）
  const outer = new THREE.Mesh(boxGeo, winFrameMat)
  outer.scale.set(ww + 0.17, hh + 0.17, 0.045)
  outer.position.set(x + nx * 0.01, y, z + nz * 0.01)
  outer.rotation.y = ry
  g.add(outer)

  // 玻璃（更深，嵌在窗套内）
  const glass = new THREE.Mesh(boxGeo, winGlassMat)
  glass.scale.set(ww, hh, 0.05)
  glass.position.set(x + nx * 0.028, y, z + nz * 0.028)
  glass.rotation.y = ry
  g.add(glass)

  // 窗棂
  const mv = new THREE.Mesh(boxGeo, winTrimMat)
  mv.scale.set(0.032, hh, 0.062)
  mv.position.set(x + nx * 0.036, y, z + nz * 0.036)
  mv.rotation.y = ry
  g.add(mv)
  const mh = new THREE.Mesh(boxGeo, winTrimMat)
  mh.scale.set(ww, 0.032, 0.062)
  mh.position.set(x + nx * 0.036, y, z + nz * 0.036)
  mh.rotation.y = ry
  g.add(mh)

  // 窗台
  const sill = new THREE.Mesh(boxGeo, winTrimMat)
  sill.scale.set(ww + 0.24, 0.055, 0.13)
  sill.position.set(x + nx * 0.055, y - hh / 2 - 0.035, z + nz * 0.055)
  sill.rotation.y = ry
  g.add(sill)
}

/* 双坡屋顶：两块斜板 + 两片山墙 + 屋脊 */
function addRoof(g, w, d, h, color) {
  const rh = Math.min(h * 0.85, d * 0.62)
  const ov = 0.26
  const halfD = d / 2 + ov
  const L = Math.hypot(halfD, rh)
  const ang = Math.atan2(rh, halfD)
  const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(color), map: roofTex, flatShading: true })
  roofMats.push(mat)

  for (const s of [-1, 1]) {
    const slab = new THREE.Mesh(new THREE.BoxGeometry(w + ov * 2, 0.15, L), mat)
    slab.position.set(0, h + rh / 2, s * halfD / 2)
    slab.rotation.x = s * ang
    slab.castShadow = true
    slab.receiveShadow = true
    g.add(slab)
  }

  // 檐口板：压在坡板外沿，让屋顶看起来有厚度
  const edgeMat = new THREE.MeshLambertMaterial({ color: new THREE.Color(color).multiplyScalar(0.70) })
  for (const s of [-1, 1]) {
    const fascia = new THREE.Mesh(boxGeo, edgeMat)
    fascia.scale.set(w + ov * 2 + 0.02, 0.12, 0.08)
    fascia.position.set(0, h - 0.025, s * halfD)
    fascia.castShadow = true
    g.add(fascia)
  }
  // 山墙三角
  const shape = new THREE.Shape()
  shape.moveTo(-d / 2, 0)
  shape.lineTo(d / 2, 0)
  shape.lineTo(0, rh)
  shape.closePath()
  const gableGeo = new THREE.ShapeGeometry(shape)
  const wallMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#e8dfcd') })
  for (const s of [-1, 1]) {
    const gable = new THREE.Mesh(gableGeo, wallMat)
    gable.position.set(s * w / 2, h, 0)
    gable.rotation.y = s * Math.PI / 2
    gable.castShadow = true
    g.add(gable)
  }
  // 屋脊
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(w + ov * 2, 0.1, 0.16), mat)
  ridge.position.set(0, h + rh, 0)
  g.add(ridge)
  return rh
}

function makeHouse(cfg) {
  const c = Object.assign({ rot: 0, w: 2.6, d: 2.1, h: 1.5, floors: 1,
    wall: '#ece3d2', roof: '#b3563e' }, cfg)
  const g = new THREE.Group()
  g.position.set(c.x, 0, c.z)
  g.rotation.y = c.rot
  const H = c.h * c.floors

  // 石基
  const base = new THREE.Mesh(boxGeo, stoneBaseMat)
  base.scale.set(c.w + 0.16, 0.2, c.d + 0.16)
  base.position.y = 0.1
  base.receiveShadow = true
  base.castShadow = true
  g.add(base)
  addGroundBlob(g, (c.w + 0.7) * 1.02, (c.d + 0.7) * 1.02, 0.016)

  // 墙体
  const wallMat = new THREE.MeshLambertMaterial({ color: new THREE.Color(c.wall) })
  const body = new THREE.Mesh(boxGeo, wallMat)
  body.scale.set(c.w, H, c.d)
  body.position.y = 0.2 + H / 2
  body.castShadow = true
  body.receiveShadow = true
  body.userData.label = c.name
  g.add(body)
  clickables.push(body)

  timberFrame(g, c.w, c.d, 0.2, H)

  // 二层腰线
  if (c.floors > 1) {
    addBox(g, c.w + 0.2, 0.13, c.d + 0.2, 0, 0.2 + c.h, 0, timberMat)
  }

  const rh = addRoof(g, c.w, c.d, H + 0.2, c.roof)

  // 门（正面 +z）
  const door = new THREE.Mesh(boxGeo, doorMat)
  door.scale.set(0.52, 0.86, 0.08)
  door.position.set(0, 0.2 + 0.43, c.d / 2 + 0.03)
  g.add(door)

  // 窗
  const wy = 0.2 + H * 0.58
  const wy2 = c.floors > 1 ? 0.2 + c.h * 0.58 : wy
  addWindow(g, -c.w * 0.28, wy, c.d / 2 + 0.03, 0, 0.36, 0.44)
  addWindow(g, c.w * 0.28, wy, c.d / 2 + 0.03, 0, 0.36, 0.44)
  addWindow(g, c.w / 2 + 0.03, wy, 0, Math.PI / 2, 0.34, 0.42)
  addWindow(g, -c.w / 2 - 0.03, wy, 0, Math.PI / 2, 0.34, 0.42)
  if (c.floors > 1) {
    addWindow(g, 0, 0.2 + c.h * 1.55, c.d / 2 + 0.03, 0, 0.5, 0.4)
  }

  // 烟囱
  if (c.chimney !== false) {
    const ch = new THREE.Mesh(boxGeo, stoneBaseMat)
    ch.scale.set(0.26, 0.62, 0.26)
    ch.position.set(c.w * 0.3, 0.2 + H + rh * 0.55, -c.d * 0.18)
    ch.castShadow = true
    g.add(ch)
    const cap = new THREE.Mesh(boxGeo, timberMat)
    cap.scale.set(0.34, 0.08, 0.34)
    cap.position.copy(ch.position)
    cap.position.y += 0.35
    g.add(cap)
  }

  scene.add(g)
  return g
}

  const spireMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#4d5d75'), flatShading: true })

  spire.position.set(W / 2 + 0.45, 0.24 + th + 0.85, -D / 2 + 0.75)
  spire.rotation.y = Math.PI / 4
  spire.castShadow = true

  // 塔尖十字
  const crossMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#e9dcae') })
  const cx = W / 2 + 0.45, cyTop = 0.24 + th + 1.70, cz = -D / 2 + 0.75
  const crossV = new THREE.Mesh(boxGeo, crossMat)

  crossH.scale.set(0.26, 0.05, 0.05)
  crossH.position.set(cx, cyTop + 0.30, cz)
  g.add(crossH)

  // 玫瑰窗
  const roseMat = new THREE.MeshLambertMaterial({
    color: new THREE.Color('#f0d79a'),
    emissive: new THREE.Color('#ffbe5e'),
    emissiveIntensity: 0.2,
  })
  windowMats.push(roseMat)
  const rose = new THREE.Mesh(new THREE.CircleGeometry(0.42, 16), roseMat)
  rose.position.set(0, 0.24 + H * 0.74, D / 2 + 0.012)
  g.add(rose)

  // 大门
  const door = new THREE.Mesh(boxGeo, doorMat)
  door.scale.set(0.8, 1.3, 0.1)
  door.position.set(0, 0.24 + 0.65, D / 2 + 0.03)
  g.add(door)

  // 两侧长窗
  for (const s of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const win = new THREE.Mesh(boxGeo, roseMat)
      win.scale.set(0.06, 0.72, 0.28)
      win.position.set(s * (W / 2 + 0.02), 0.24 + 1.55, -1.1 + i * 1.1)
      g.add(win)
    }
  }

  scene.add(g)
  return g
}

const trunkMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#8a6544') })
const crownMatA = new THREE.MeshLambertMaterial({ color: new THREE.Color('#8cba63') })
const crownMatB = new THREE.MeshLambertMaterial({ color: new THREE.Color('#a8cf7f') })
const blossomMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#f5c2cf') })
const crownMatC = new THREE.MeshLambertMaterial({ color: new THREE.Color('#77a553') })
const blossomDarkMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#dfa4b6') })
const trunkGeo = new THREE.CylinderGeometry(0.075, 0.11, 1, 6)
const crownGeo = new THREE.IcosahedronGeometry(1, 1)

function makeTree(x, z, s, kind) {
  const g = new THREE.Group()
  g.position.set(x, 0, z)
  const tr = new THREE.Mesh(trunkGeo, trunkMat)
  tr.scale.set(s * 1.15, s * 0.74, s * 1.15)
  tr.position.y = s * 0.34
  tr.castShadow = true
  g.add(tr)

  const mat = kind === 'blossom' ? blossomMat : (Math.random() > 0.45 ? crownMatA : crownMatB)
  const matDark = kind === 'blossom' ? blossomDarkMat : crownMatC

  // 下层暗色团：压住树冠底部，避免球体悬浮感
  const c0 = new THREE.Mesh(crownGeo, matDark)
  c0.position.set(s * 0.03, s * 0.80, s * 0.01)
  c0.scale.setScalar(s * 0.74)
  c0.rotation.y = Math.random() * 3
  c0.castShadow = true
  g.add(c0)

  // 上层错落团块：偏移小于半径，保证彼此咬合成一个冠
  const lobes = [
    [0, 1.04, 0, 0.62],
    [0.26, 1.20, 0.10, 0.50],
    [-0.24, 1.14, -0.12, 0.50],
    [0.02, 1.40, 0.04, 0.44],
    [-0.12, 1.28, 0.24, 0.38],
  ]
  for (const [dx, dy, dz, r] of lobes) {
    const c = new THREE.Mesh(crownGeo, mat)
    c.position.set(dx * s, dy * s, dz * s)
    c.scale.setScalar(s * r)
    c.rotation.y = Math.random() * 3
    c.castShadow = true
    c.receiveShadow = true
    g.add(c)
  }

  addGroundBlob(g, s * 1.55, s * 1.55, 0.014)
  scene.add(g)
  return g
}

const fenceMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#b09068') })

function fenceRun(x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1
  const len = Math.hypot(dx, dz)
  const n = Math.max(2, Math.round(len / 0.85))
  const ang = Math.atan2(dz, dx)
  for (let i = 0; i <= n; i++) {
    const t = i / n
    const post = new THREE.Mesh(boxGeo, fenceMat)
    post.scale.set(0.07, 0.46, 0.07)
    post.position.set(x1 + dx * t, 0.23, z1 + dz * t)
    post.castShadow = true
    scene.add(post)
  }
  for (const y of [0.2, 0.38]) {
    const rail = new THREE.Mesh(boxGeo, fenceMat)
    rail.scale.set(len, 0.045, 0.04)
    rail.position.set((x1 + x2) / 2, y, (z1 + z2) / 2)
    rail.rotation.y = -ang
    rail.castShadow = true
    scene.add(rail)
  }
}

function stripeTex(a, b) {
  const cv = document.createElement('canvas')
  cv.width = 64; cv.height = 64
  const ctx = cv.getContext('2d')
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 ? a : b
    ctx.fillRect(i * 8, 0, 8, 64)
  }
  const t = new THREE.CanvasTexture(cv)
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.colorSpace = THREE.SRGBColorSpace
  return t
}

function makeStall(x, z, rot, colA, colB) {
  const g = new THREE.Group()
  g.position.set(x, 0, z)
  g.rotation.y = rot

  const table = new THREE.Mesh(boxGeo, doorMat)
  table.scale.set(1.5, 0.09, 0.78)
  table.position.y = 0.62
  table.castShadow = true
  table.receiveShadow = true
  g.add(table)

  for (const sx of [-0.62, 0.62]) {
    for (const sz of [-0.3, 0.3]) {
      const leg = new THREE.Mesh(boxGeo, doorMat)
      leg.scale.set(0.07, 0.62, 0.07)
      leg.position.set(sx, 0.31, sz)
      g.add(leg)
    }
  }

  // 条纹顶棚
  const tex = stripeTex(colA, colB)
  const clothMat = new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide })
  const W = 1.9, halfD = 0.62, peak = 0.5
  const L = Math.hypot(halfD, peak)
  const ang = Math.atan2(peak, halfD)
  for (const s of [-1, 1]) {
    const cloth = new THREE.Mesh(new THREE.BoxGeometry(W, 0.045, L), clothMat)
    cloth.position.set(0, 1.62 + peak / 2, s * halfD / 2)
    cloth.rotation.x = -s * ang
    cloth.castShadow = true
    g.add(cloth)
  }
  // 支杆
  for (const sx of [-0.9, 0.9]) {
    for (const sz of [-0.58, 0.58]) {
      const p = new THREE.Mesh(boxGeo, fenceMat)
      p.scale.set(0.055, 1.65, 0.055)
      p.position.set(sx, 0.83, sz)
      g.add(p)
    }
  }
  // 桌上的货
  for (let i = 0; i < 4; i++) {
    const it = new THREE.Mesh(boxGeo, i % 2 ? crownMatB : doorMat)
    it.scale.set(0.16, 0.16, 0.16)
    it.position.set(-0.5 + i * 0.33, 0.74, 0.06)
    it.castShadow = true
    g.add(it)
  }
  scene.add(g)
  return g
}

/* 季节权重插值：1.4 秒完成过渡 */
function updateSeason(dt) {
  const k = dt / 1.4
  for (const s of SEASON_KEYS) {
    const target = s === state.season ? 1 : 0
    const cur = state.blend[s]
    state.blend[s] = cur + clamp(target - cur, -k, k)
  }
  let sum = 0
  for (const s of SEASON_KEYS) sum += state.blend[s]
  if (sum > 0.0001) {
    for (const s of SEASON_KEYS) state.blend[s] /= sum
  }
}

function updateSeasonColors() {
  grassMat.color.copy(seasonMix('grass'))
  turfMat.color.copy(seasonMix('grass')).multiplyScalar(0.80)
  crownMatA.color.copy(seasonMix('leaf'))
  crownMatB.color.copy(seasonMix('leaf2'))
  blossomMat.color.copy(seasonMix('blossom'))
  crownMatC.color.copy(seasonMix('leaf')).multiplyScalar(0.76)
  blossomDarkMat.color.copy(seasonMix('blossom')).multiplyScalar(0.86)
  soilMat.color.copy(seasonMix('soil'))
  rockMat.color.copy(seasonMix('soil')).multiplyScalar(0.86)
  rockDeepMat.color.copy(seasonMix('soil')).multiplyScalar(0.70)

  const snow = state.blend.winter
  snowMat.opacity = snow * 0.94
  snowLayer.visible = snow > 0.012
  for (const m of roofMats) {
    m.color.copy(m.userData.base).lerp(WHITE, snow * 0.6)
  }
}

function updateDayNight() {
  const m = state.minute
  const sh = sunHeightAt(m)
  const nightF = smooth(0.15, -0.08, sh)
  const dayF = 1 - nightF

  const az = 0.52 + (m - 360) / DAY * 1.35
  /* 太阳放在岛的背面，投下的长影朝向画面前方，与参考图一致 */
  sun.position.set(Math.cos(az) * 64, 10 + Math.max(sh, 0) * 26, -Math.sin(az) * 64)
  sun.intensity = smooth(-0.04, 0.30, sh) * 2.2
  moon.intensity = nightF * 0.95
  fill.intensity = 0.18 + dayF * 0.34
  hemi.intensity = 0.46 + dayF * 0.50
  bounce.intensity = 0.12 + dayF * 0.46
  hemi.color.copy(NIGHT_SKY).lerp(DAY_SKY, dayF)
  hemi.groundColor.copy(NIGHT_GND).lerp(DAY_GND, dayF)

  /* 背景：CSS 线性渐变，比纯色更有空气感 */
  const sky = skyAt(m)
  const bg = `linear-gradient(180deg,${sky.top.getStyle()} 0%,${sky.fog.getStyle()} 76%,${sky.fog.getStyle()} 100%)`
  if (bg !== _bgCache) {
    _bgCache = bg
    elApp.style.backgroundImage = bg
  }
  scene.fog.color.copy(sky.fog)

  /* 天空云层与日晕：贴着相机方向布置，随时间移动 */
  elSkyCloud.style.opacity = String(0.14 + dayF * 0.74)
  const sRight = (Math.cos(az) + Math.sin(az)) / Math.SQRT2
  elSunGlow.style.left = `${clamp(50 + sRight * 44, 6, 94)}%`
  elSunGlow.style.top = `${clamp(44 - sun.position.y / 110 * 40, 6, 70)}%`
  elSunGlow.style.opacity = String(dayF * 0.9 * smooth(-0.06, 0.20, sh))

  starMat.opacity = nightF * 0.9

  const wg = 0.1 + nightF * 2.1
  for (const mt of windowMats) mt.emissiveIntensity = wg
  const lg = 0.12 + nightF * 2.4
  for (const mt of lampMats) mt.emissiveIntensity = lg
  for (const l of pointLights) l.intensity = nightF * 10

  _cloudCol.copy(DAY_CLOUD).lerp(NIGHT_CLOUD, nightF)
  for (const mt of cloudMats) mt.color.copy(_cloudCol)

  waterMat.emissiveIntensity = 0.1 + nightF * 0.25
  waterMat.color.copy(DAY_WATER).lerp(NIGHT_WATER, nightF)
  foamMat.opacity = 0.42 * dayF

  if ((nightF > 0.52) !== document.body.classList.contains('is-night')) {
    document.body.classList.toggle('is-night', nightF > 0.52)
  }

  return nightF
}

/* ── 主循环 ── */
const clock = new THREE.Clock()
let hudAccum = 0
let elapsed = 0

function animate() {
  requestAnimationFrame(animate)
  const dt = Math.min(clock.getDelta(), 0.05)

  if (state.playing) {
    state.minute = (state.minute + state.speed * dt) % DAY
    elSlider.value = String(state.minute)
  }

  updateSeason(dt)
  updateSeasonColors()
  const nightF = updateDayNight()
  elapsed += dt

  // 水纹向下游滚动
  waterTex.offset.y = (waterTex.offset.y - dt * 0.055) % 1

  // 萤火虫：夜间漂浮，缓慢明灭
  fireflyMat.opacity = Math.max(0, nightF - 0.22) * 1.2
  if (nightF > 0.18) {
    const arr = fireflyGeo.attributes.position.array
    for (let i = 0; i < FIREFLY_N; i++) {
      const s = fireflySeed[i]
      arr[i * 3] = fireflyBase[i * 3] + Math.sin(elapsed * s.sp + s.ph) * 0.55
      arr[i * 3 + 1] = fireflyBase[i * 3 + 1] + Math.sin(elapsed * s.sp * 1.7 + s.ph) * 0.45
      arr[i * 3 + 2] = fireflyBase[i * 3 + 2] + Math.cos(elapsed * s.sp * 0.9 + s.ph) * 0.55
    }
    fireflyGeo.attributes.position.needsUpdate = true
  }

  // 风车与行人
  for (const b of windmillBlades) b.rotation.z += dt * 0.5
  for (const v of villagers) {
    v.t = (v.t + v.speed * dt) % 1
    const p = v.curve.getPointAt(v.t)
    const tan = v.curve.getTangentAt(v.t)
    v.g.position.set(p.x, 0.02, p.z)
    v.g.rotation.y = Math.atan2(tan.x, tan.z)
  }

  // 相机缓动
  if (camGoal) {
    const k = 1 - Math.pow(0.0015, dt)
    controls.target.lerp(camGoal.target, k)
    camera.zoom += (camGoal.zoom - camera.zoom) * k
    camera.updateProjectionMatrix()
    if (controls.target.distanceTo(camGoal.target) < 0.03 &&
        Math.abs(camera.zoom - camGoal.zoom) < 0.01) {
      camGoal = null
    }
  }

  // HUD 节流刷新
  hudAccum += dt
  if (hudAccum > 0.12) {
    hudAccum = 0
    elClock.textContent = fmtClock(state.minute)
    const ph = phaseOf(state.minute)
    if (ph[0] !== lastPhase) {
      lastPhase = ph[0]
      elPhase.textContent = ph[0]
      elPhaseIco.textContent = ph[1]
    }
  }

  controls.update()
  renderer.render(scene, camera)
}

updateSeasonColors()
animate()

/* 首帧渲染完再揭开载入层 */
requestAnimationFrame(() => requestAnimationFrame(() => {
  const boot = $('boot')
  if (!boot) return
  boot.classList.add('done')
  setTimeout(() => boot.remove(), 900)
}))

</script>
